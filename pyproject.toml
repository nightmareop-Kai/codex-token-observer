[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-token-counter"
version = "0.3.0"
description = "Local-first TODAY and TOTAL Codex token counter"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-token-counter = "codex_token_counter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
